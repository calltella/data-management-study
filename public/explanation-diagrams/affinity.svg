<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" font-family="Noto Sans JP, sans-serif">
<title>親和図の例</title>
<rect width="480" height="180" fill="white"/>
<rect x="18" y="12" width="215" height="154" rx="5" fill="#edf5fb" stroke="#98aebe"/>
<text x="125" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#243b4b">作業環境</text>
<rect x="31" y="55" width="189" height="36" rx="5" fill="#fff" stroke="#98aebe"/>
<text x="125" y="79" text-anchor="middle" font-size="18" font-weight="400" fill="#243b4b">手元が暗い</text>
<rect x="31" y="105" width="189" height="36" rx="5" fill="#fff" stroke="#98aebe"/>
<text x="125" y="129" text-anchor="middle" font-size="18" font-weight="400" fill="#243b4b">工具が取りにくい</text>
<rect x="247" y="12" width="215" height="154" rx="5" fill="#edf5fb" stroke="#98aebe"/>
<text x="354" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#243b4b">作業手順</text>
<rect x="260" y="55" width="189" height="36" rx="5" fill="#fff" stroke="#98aebe"/>
<text x="354" y="79" text-anchor="middle" font-size="18" font-weight="400" fill="#243b4b">見本が古い</text>
<rect x="260" y="105" width="189" height="36" rx="5" fill="#fff" stroke="#98aebe"/>
<text x="354" y="129" text-anchor="middle" font-size="18" font-weight="400" fill="#243b4b">確認箇所が曖昧</text>
</svg>
